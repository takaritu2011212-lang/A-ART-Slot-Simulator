CreditBtn" class="btn btn-credit">クレジット +1000枚</button></div></div><div class="stats-section"><h2>統計データ</h2><div class="stats-grid"><div class="stat-box"><div class="stat-label">総ゲーム数</div><div class="stat-value" id="totalGames">0</div></div><div class="stat-box"><div class="stat-label">総投入</div><div class="stat-value" id="totalBet">0</div></div><div class="stat-box"><div class="stat-label">総払出</div><div class="stat-value" id="totalPayout">0</div></div><div class="stat-box"><div class="stat-label">機械割</div><div class="stat-value" id="percentage">0%</div></div><div class="stat-box"><div class="stat-label">BIG</div><div class="stat-value" id="bigCount">0</div></div><div class="stat-box"><div class="stat-label">REG</div><div class="stat-value" id="regCount">0</div></div><div class="stat-box"><div class="stat-label">ART初回</div><div class="stat-value" id="artCount">0</div></div><div class="stat-box"><div class="stat-label">ART総G</div><div class="stat-value" id="artTotalG">0</div></div><div class="stat-box"><div class="stat-label">平均ART</div><div class="stat-value" id="avgArtG">0G</div></div><div class="stat-box"><div class="stat-label">参戦</div><div class="stat-value" id="sankuCount">0</div></div><div class="stat-box"><div class="stat-label">バースト</div><div class="stat-value" id="burstCount">0</div></div><div class="stat-box"><div class="stat-label">設定</div><div class="stat-value" id="settingDisplay">1</div></div></div><div class="action-buttons"><button id="resetBtn" class="btn btn-secondary">データリセット</button><div class="setting-control"><label for="settingSelect">設定:</label><select id="settingSelect"><option value="1">設定1</option><option value="2">設定2</option><option value="3">設定3</option><option value="4">設定4</option><option value="5">設定5</option><option value="6">設定6</option></select></div></div></div><footer class="footer"><p>A+ART方式パチスロ機 完全仕様書準拠シミュレーター</p><p>開発版 v0.4.1</p></footer></div><script>window.__AART_DEBUG__={events:[],errors:[],boot:Date.now(),enabled:false};window.__AART_LOG__=function(type,message,detail){var d=window.__AART_DEBUG__;var item={time:new Date().toLocaleTimeString(),type:type,message:String(message||''),detail:detail||''};d.events.push(item);if(d.events.length>80)d.events.shift();if(!d.enabled)return;var box=document.getElementById('aartDebugLog');if(box){var row=document.createElement('div');row.className='aart-debug-row '+(type==='ERROR'?'error':'');row.textContent='['+item.time+'] '+type+' '+item.message+(item.detail?' | '+item.detail:'');box.prepend(row);box.scrollTop=box.scrollHeight;}};window.__AART_SET_DEBUG__=function(enabled){var d=window.__AART_DEBUG__;d.enabled=!!enabled;var panel=document.getElementById('aartDebugPanel');var btn=document.getElementById('aartDebugToggle');if(panel)panel.hidden=!d.enabled;if(btn){btn.textContent=d.enabled?'ログ OFF':'ログ ON';btn.classList.toggle('debug-on',d.enabled);}if(d.enabled){var box=document.getElementById('aartDebugLog');if(box){box.innerHTML='';d.events.slice().reverse().forEach(function(item){var row=document.createElement('div');row.className='aart-debug-row '+(item.type==='ERROR'?'error':'');row.textContent='['+item.time+'] '+item.type+' '+item.message+(item.detail?' | '+item.detail:'');box.appendChild(row);});box.scrollTop=box.scrollHeight;}}};window.addEventListener('error',function(e){window.__AART_DEBUG__.errors.push(e);window.__AART_LOG__('ERROR',e.message||'window error',e.filename?e.filename+':'+e.lineno+':'+e.colno:'');});window.addEventListener('unhandledrejection',function(e){window.__AART_DEBUG__.errors.push(e.reason);window.__AART_LOG__('ERROR','Unhandled Promise',e.reason&&e.reason.stack||e.reason);});document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button');if(b&&b.id!=='aartDebugToggle')window.__AART_LOG__('CLICK',b.id||'(no id)','disabled='+b.disabled);},true);document.addEventListener('DOMContentLoaded',function(){var btn=document.createElement('button');btn.id='aartDebugToggle';btn.type='button';btn.className='aart-debug-toggle';btn.textContent='ログ ON';btn.addEventListener('click',function(){window.__AART_SET_DEBUG__(!window.__AART_DEBUG__.enabled);});document.body.appendChild(btn);var p=document.createElement('details');p.id='aartDebugPanel';p.hidden=true;p.innerHTML='<summary>DEBUG / エラー診断</summary><div id="aartDebugStatus">ページ起動を確認中...</div><div id="aartDebugLog"></div>';document.body.appendChild(p);window.__AART_LOG__('BOOT','DOM loaded','main script loading');});</script><script src="js/constants.js?v=20260914-6"></script><script src="js/storage.js?v=20260914-7"></script><script src="js/audio.js?v=20260914-6"></script><script src="js/game_v3.js?v=20260914-6"></script><script src="js/renderer_v7.js?v=20260914-2"></script><script src="js/presentation_system_v1.js?v=20260914-1"></script><script src="js/current_presentation_v1.js?v=20260914-2"></script><script src="js/main_v3.js?v=20260914-8"></script><script src="js/ui_fixes_v1.js?v=20260914-3"></script><script src="js/presentation_runtime_v2.js?v=20260914-3"></script><script src="js/test_controls_v1.js?v=20260914-1"></script></body></html>
